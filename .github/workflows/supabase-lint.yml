name: Supabase Lint & Function Privileges

on:
  push:
    branches: [main]
  pull_request:

jobs:
  supabase-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run Supabase DB linter (fail on any warning)
        run: |
          OUT=$(supabase db lint --level warning)
          echo "$OUT"
          if echo "$OUT" | grep -Eiq 'warning|error'; then
            echo "::error::Supabase linter reported issues"
            exit 1
          fi

      - name: Verify function privileges (no PUBLIC EXECUTE on SECURITY DEFINER)
        run: |
          supabase db execute <<'SQL'
          DO $$
          DECLARE bad_count int;
          BEGIN
            SELECT count(*) INTO bad_count
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.prosecdef = true
              AND has_function_privilege('public', p.oid, 'EXECUTE');
            IF bad_count > 0 THEN
              RAISE EXCEPTION 'Found % SECURITY DEFINER function(s) with PUBLIC EXECUTE', bad_count;
            END IF;
          END $$;
          SQL

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
